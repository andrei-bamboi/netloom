<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; fill: #475569; }
      .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .s { font-size: 12px; fill: #64748b; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; fill: #1e293b; }
      .monos { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #1e293b; }
      .lbl { font-size: 12px; font-weight: 600; fill: #334155; }
      .badge { font-size: 11px; font-weight: 700; }
      .flow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
      .num { font-size: 12px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1800" height="1060" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" class="title">netloom</text>
  <text x="175" y="52" class="subtitle">Authenticated, asynchronous API that creates AWS VPCs with multiple subnets and records every resource</text>
  <g transform="translate(40,74)">
    <rect width="12" height="12" rx="3" fill="#ede9fe" stroke="#7c3aed"/><text x="18" y="11" class="s">Edge / auth</text>
    <rect x="110" width="12" height="12" rx="3" fill="#ffedd5" stroke="#ea580c"/><text x="128" y="11" class="s">Compute (Python 3.13)</text>
    <rect x="285" width="12" height="12" rx="3" fill="#fce7f3" stroke="#db2777"/><text x="303" y="11" class="s">Orchestration</text>
    <rect x="410" width="12" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="428" y="11" class="s">Data</text>
    <rect x="480" width="12" height="12" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="498" y="11" class="s">Provisioned network</text>
  </g>

  <!-- AWS region -->
  <rect x="250" y="108" width="1530" height="722" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="272" y="134" class="lbl" fill="#475569">AWS region · eu-central-1 (all resources tagged Project=netloom)</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="30" y="330" width="150" height="120" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  </g>
  <circle cx="105" cy="362" r="14" fill="#e2e8f0" stroke="#334155"/>
  <path d="M91,392 q14,-18 28,0" fill="#e2e8f0" stroke="#334155"/>
  <text x="105" y="418" text-anchor="middle" class="h">Client</text>
  <text x="105" y="437" text-anchor="middle" class="s">user · CI · script</text>

  <!-- Edge group -->
  <rect x="275" y="150" width="350" height="560" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="290" y="140" width="190" height="20" rx="4" fill="#f8fafc"/>
  <text x="296" y="155" class="lbl" fill="#7c3aed">EDGE · enable_edge = true</text>

  <!-- Cognito -->
  <g filter="url(#shadow)">
    <rect x="300" y="172" width="300" height="122" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="318" y="200" class="h">Amazon Cognito</text>
  <text x="318" y="222" class="t">User pool · admin-invite only · MFA optional</text>
  <text x="318" y="242" class="t">• humans: e-mail + password</text>
  <text x="318" y="262" class="t">• machines: OAuth2 client_credentials</text>
  <text x="318" y="282" class="s">scope netloom/api · tokens 60 min</text>

  <!-- API Gateway -->
  <g filter="url(#shadow)">
    <rect x="300" y="330" width="300" height="362" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="318" y="358" class="h">API Gateway · HTTP API</text>
  <text x="318" y="379" class="t">JWT authorizer (issuer · audience · expiry)</text>
  <text x="318" y="397" class="s">throttling 20 rps / burst 40 · JSON access logs</text>
  <line x1="314" y1="410" x2="586" y2="410" stroke="#c4b5fd"/>

  <g transform="translate(316,418)">
    <!-- route rows: badge + path + lock -->
    <rect x="0" y="0" width="52" height="20" rx="4" fill="#dcfce7"/><text x="26" y="14" text-anchor="middle" class="badge" fill="#15803d">GET</text>
    <text x="60" y="15" class="mono">/v1/health</text><text x="268" y="15" text-anchor="end" class="s">public</text>

    <rect x="0" y="28" width="52" height="20" rx="4" fill="#dcfce7"/><text x="26" y="42" text-anchor="middle" class="badge" fill="#15803d">GET</text>
    <text x="60" y="43" class="mono">/v1/me</text>

    <rect x="0" y="56" width="52" height="20" rx="4" fill="#dbeafe"/><text x="26" y="70" text-anchor="middle" class="badge" fill="#1d4ed8">POST</text>
    <text x="60" y="71" class="mono">/v1/plans</text><text x="268" y="71" text-anchor="end" class="s">dry-run</text>

    <rect x="0" y="84" width="52" height="20" rx="4" fill="#dbeafe"/><text x="26" y="98" text-anchor="middle" class="badge" fill="#1d4ed8">POST</text>
    <text x="60" y="99" class="mono">/v1/networks</text><text x="268" y="99" text-anchor="end" class="s">→ 202</text>

    <rect x="0" y="112" width="52" height="20" rx="4" fill="#dcfce7"/><text x="26" y="126" text-anchor="middle" class="badge" fill="#15803d">GET</text>
    <text x="60" y="127" class="mono">/v1/networks</text><text x="268" y="127" text-anchor="end" class="s">paged</text>

    <rect x="0" y="140" width="52" height="20" rx="4" fill="#dcfce7"/><text x="26" y="154" text-anchor="middle" class="badge" fill="#15803d">GET</text>
    <text x="60" y="155" class="mono">/v1/networks/{id}</text>

    <rect x="0" y="168" width="52" height="20" rx="4" fill="#dcfce7"/><text x="26" y="182" text-anchor="middle" class="badge" fill="#15803d">GET</text>
    <text x="60" y="183" class="mono">/v1/networks/{id}/subnets</text>

    <rect x="0" y="196" width="52" height="20" rx="4" fill="#dcfce7"/><text x="26" y="210" text-anchor="middle" class="badge" fill="#15803d">GET</text>
    <text x="60" y="211" class="mono">/v1/networks/{id}/events</text>

    <rect x="0" y="224" width="52" height="20" rx="4" fill="#fee2e2"/><text x="26" y="238" text-anchor="middle" class="badge" fill="#b91c1c">DELETE</text>
    <text x="60" y="239" class="mono">/v1/networks/{id}</text><text x="268" y="239" text-anchor="end" class="s">→ 202</text>
  </g>
  <text x="318" y="682" class="s">+ public: /docs (Swagger UI), openapi.json</text>

  <!-- λ api -->
  <g filter="url(#shadow)">
    <rect x="690" y="400" width="215" height="140" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  </g>
  <text x="708" y="428" class="h">λ api</text>
  <text x="708" y="450" class="t">route by routeKey</text>
  <text x="708" y="469" class="t">validate + carve CIDRs</text>
  <text x="708" y="488" class="t">Idempotency-Key</text>
  <text x="708" y="507" class="t">audit actor from claims</text>
  <text x="708" y="528" class="s">arm64 · 256 MB · X-Ray</text>

  <!-- Step Functions -->
  <g filter="url(#shadow)">
    <rect x="960" y="150" width="290" height="455" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  </g>
  <text x="978" y="178" class="h">Step Functions · lifecycle</text>
  <text x="978" y="198" class="s">STANDARD · retries 6× jittered back-off</text>

  <g transform="translate(985,212)">
    <polygon points="70,0 140,16 70,32 0,16" fill="#ffffff" stroke="#db2777"/>
    <text x="70" y="21" text-anchor="middle" class="lbl">Route op</text>
    <text x="150" y="10" class="s">delete</text>
    <text x="64" y="45" text-anchor="end" class="s">create</text>

    <g class="steps">
      <rect x="0" y="48" width="140" height="28" rx="6" fill="#ffffff" stroke="#db2777"/><text x="70" y="67" text-anchor="middle" class="t">Begin</text>
      <rect x="0" y="90" width="140" height="28" rx="6" fill="#ffffff" stroke="#db2777"/><text x="70" y="109" text-anchor="middle" class="t">CreateVpc</text>
      <rect x="0" y="132" width="140" height="28" rx="6" fill="#ffffff" stroke="#db2777"/><text x="70" y="151" text-anchor="middle" class="t">CreateSubnets</text>
      <rect x="0" y="174" width="140" height="28" rx="6" fill="#ffffff" stroke="#db2777"/><text x="70" y="193" text-anchor="middle" class="t">ConfigureRouting</text>
      <rect x="0" y="216" width="140" height="28" rx="6" fill="#ffffff" stroke="#db2777"/><text x="70" y="235" text-anchor="middle" class="t">Finalize</text>
      <rect x="0" y="258" width="140" height="28" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="70" y="277" text-anchor="middle" class="t">AVAILABLE</text>
    </g>
    <path d="M70,32 V46 M70,76 V88 M70,118 V130 M70,160 V172 M70,202 V214 M70,244 V256" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- error branch -->
    <path d="M140,146 H168 V300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowRed)"/>
    <text x="174" y="150" class="s" fill="#dc2626">any</text>
    <text x="174" y="164" class="s" fill="#dc2626">failure</text>
    <rect x="110" y="302" width="135" height="28" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="177" y="321" text-anchor="middle" class="t">Rollback</text>
    <rect x="110" y="344" width="135" height="28" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="177" y="363" text-anchor="middle" class="t">MarkFailed</text>
    <path d="M177,330 V342" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

    <!-- delete branch -->
    <path d="M140,16 H232 V46" stroke="#db2777" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="186" y="48" width="64" height="28" rx="6" fill="#ffffff" stroke="#db2777"/><text x="218" y="67" text-anchor="middle" class="s">Teardown</text>
    <rect x="186" y="90" width="64" height="28" rx="6" fill="#ffffff" stroke="#db2777"/><text x="218" y="109" text-anchor="middle" class="s">Retire</text>
    <path d="M218,76 V88" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- λ worker -->
  <g filter="url(#shadow)">
    <rect x="1290" y="300" width="190" height="170" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  </g>
  <text x="1308" y="328" class="h">λ worker</text>
  <text x="1308" y="350" class="t">one step per call</text>
  <text x="1308" y="369" class="t">idempotent: ledger +</text>
  <text x="1308" y="388" class="t">find-by-tag recovery</text>
  <text x="1308" y="407" class="t">transient → retry</text>
  <text x="1308" y="426" class="t">permanent → rollback</text>
  <text x="1308" y="452" class="s">IAM: tag-scoped EC2</text>

  <!-- VPC -->
  <g filter="url(#shadow)">
    <rect x="1520" y="150" width="245" height="480" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <text x="1536" y="178" class="h">Amazon VPC</text>
  <text x="1536" y="197" class="monos">10.42.0.0/16 · DNS on</text>

  <rect x="1580" y="212" width="125" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="1642" y="232" text-anchor="middle" class="t">Internet Gateway</text>

  <g>
    <rect x="1532" y="262" width="108" height="250" rx="8" fill="none" stroke="#86efac" stroke-dasharray="4 3"/>
    <text x="1586" y="280" text-anchor="middle" class="lbl">AZ a</text>
    <rect x="1540" y="290" width="92" height="88" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1586" y="310" text-anchor="middle" class="lbl" fill="#15803d">public-a</text>
    <text x="1586" y="328" text-anchor="middle" class="monos">10.42.0.0/24</text>
    <text x="1586" y="346" text-anchor="middle" class="s">public IP on</text>
    <text x="1586" y="364" text-anchor="middle" class="s">launch</text>
    <rect x="1540" y="392" width="92" height="110" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="1586" y="412" text-anchor="middle" class="lbl" fill="#0369a1">private-a</text>
    <text x="1586" y="430" text-anchor="middle" class="monos">10.42.2.0/24</text>
    <text x="1586" y="448" text-anchor="middle" class="s">no internet</text>
    <text x="1586" y="466" text-anchor="middle" class="s">route</text>
  </g>
  <g>
    <rect x="1648" y="262" width="108" height="250" rx="8" fill="none" stroke="#86efac" stroke-dasharray="4 3"/>
    <text x="1702" y="280" text-anchor="middle" class="lbl">AZ b</text>
    <rect x="1656" y="290" width="92" height="88" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1702" y="310" text-anchor="middle" class="lbl" fill="#15803d">public-b</text>
    <text x="1702" y="328" text-anchor="middle" class="monos">10.42.1.0/24</text>
    <text x="1702" y="346" text-anchor="middle" class="s">public IP on</text>
    <text x="1702" y="364" text-anchor="middle" class="s">launch</text>
    <rect x="1656" y="392" width="92" height="110" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="1702" y="412" text-anchor="middle" class="lbl" fill="#0369a1">private-b</text>
    <text x="1702" y="430" text-anchor="middle" class="monos">10.42.3.0/24</text>
    <text x="1702" y="448" text-anchor="middle" class="s">no internet</text>
    <text x="1702" y="466" text-anchor="middle" class="s">route</text>
  </g>
  <rect x="1540" y="526" width="208" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="1644" y="546" text-anchor="middle" class="monos">public RT: 0.0.0.0/0 → IGW</text>
  <text x="1536" y="580" class="s">tags: netloom:managed=true</text>
  <text x="1536" y="598" class="s">netloom:network-id=net-…</text>
  <text x="1536" y="616" class="s">example: 2 tiers × 2 zones, /24</text>

  <!-- DynamoDB -->
  <g filter="url(#shadow)">
    <rect x="690" y="670" width="790" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="708" y="698" class="h">DynamoDB · ledger (single table)</text>
  <text x="1462" y="698" text-anchor="end" class="s">on-demand · PITR · encrypted · TTL</text>
  <g transform="translate(708,712)">
    <rect width="180" height="78" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="10" y="20" class="monos">NET#id · META</text>
    <text x="10" y="40" class="s">status, cidr, vpc_id, igw,</text>
    <text x="10" y="56" class="s">created_by, error</text>
    <rect x="192" width="180" height="78" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="202" y="20" class="monos">NET#id · SUB#key</text>
    <text x="202" y="40" class="s">cidr, tier, zone, AZ,</text>
    <text x="202" y="56" class="s">subnet_id, state</text>
    <rect x="384" width="180" height="78" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="394" y="20" class="monos">NET#id · EVT#ts</text>
    <text x="394" y="40" class="s">append-only audit trail</text>
    <text x="394" y="56" class="s">who · what · when</text>
    <rect x="576" width="180" height="78" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="586" y="20" class="monos">IDEM#sub#key</text>
    <text x="586" y="40" class="s">idempotency reservation</text>
    <text x="586" y="56" class="s">expires after 24 h (TTL)</text>
  </g>

  <!-- ======== flows ======== -->
  <!-- 1 sign in -->
  <path d="M90,330 V233 H296" class="flow"/>
  <circle cx="90" cy="280" r="11" fill="#7c3aed"/><text x="90" y="284" text-anchor="middle" class="num">1</text>
  <text x="120" y="226" class="lbl">sign in → JWT</text>

  <!-- 2 call api -->
  <path d="M180,390 H296" class="flow"/>
  <circle cx="194" cy="390" r="11" fill="#7c3aed"/><text x="194" y="394" text-anchor="middle" class="num">2</text>
  <text x="268" y="380" text-anchor="end" class="s">Bearer JWT</text>
  <path d="M296,430 H180" class="flow"/>
  <text x="268" y="447" text-anchor="end" class="s">JSON reply</text>

  <!-- JWKS -->
  <path d="M560,330 V298" class="dash"/>
  <text x="566" y="318" class="s">JWKS</text>

  <!-- api gw -> lambda api -->
  <path d="M600,470 H686" class="flow"/>
  <text x="633" y="444" class="s">verified</text><text x="633" y="459" class="s">claims</text>

  <!-- api -> sfn -->
  <path d="M905,440 H956" class="flow"/>
  <circle cx="930" cy="440" r="11" fill="#db2777"/><text x="930" y="444" text-anchor="middle" class="num">3</text>
  <text x="914" y="424" class="s">start</text>

  <!-- api -> ddb -->
  <path d="M797,540 V666" class="flow"/>
  <text x="806" y="600" class="s">write QUEUED · read</text>
  <text x="806" y="616" class="s">(one transaction)</text>

  <!-- sfn -> worker -->
  <path d="M1250,385 H1286" class="flow"/>
  <circle cx="1268" cy="370" r="11" fill="#db2777"/><text x="1268" y="374" text-anchor="middle" class="num">4</text>

  <!-- worker -> vpc -->
  <path d="M1480,385 H1516" class="flow"/>
  <circle cx="1498" cy="370" r="11" fill="#16a34a"/><text x="1498" y="374" text-anchor="middle" class="num">5</text>

  <!-- worker -> ddb -->
  <path d="M1385,470 V666" class="flow"/>
  <circle cx="1385" cy="560" r="11" fill="#2563eb"/><text x="1385" y="564" text-anchor="middle" class="num">6</text>
  <text x="1300" y="600" class="s">record ids</text>
  <text x="1300" y="616" class="s">+ events</text>

  <!-- poll -->
  <text x="30" y="490" class="lbl">7 · poll / retrieve</text>
  <text x="30" y="508" class="s">GET /v1/networks/{id}</text>
  <text x="30" y="524" class="s">QUEUED → PROVISIONING</text>
  <text x="30" y="540" class="s">→ AVAILABLE (+ AWS ids)</text>

  <!-- ======== delivery band ======== -->
  <text x="40" y="872" class="lbl" fill="#475569">DELIVERY &amp; OPERATIONS</text>
  <g filter="url(#shadow)">
    <rect x="40" y="884" width="560" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="620" y="884" width="560" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1200" y="884" width="560" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="60" y="912" class="h">Terraform</text>
  <text x="60" y="934" class="t">modules/netloom  ← one module, every resource above</text>
  <text x="60" y="954" class="t">app/  → real AWS · S3 state with native lockfile</text>
  <text x="60" y="974" class="t">localstack/  → emulator · enable_edge = false</text>
  <text x="60" y="994" class="t">bootstrap/  → state bucket + GitHub OIDC deploy role</text>
  <text x="60" y="1012" class="s">terraform test: offline contract tests with mock providers</text>

  <text x="640" y="912" class="h">GitHub Actions</text>
  <text x="640" y="934" class="t">CI: ruff · pytest + moto (33) · terraform validate/test</text>
  <text x="640" y="954" class="t">LocalStack e2e: deploy module → create → retrieve → delete</text>
  <text x="640" y="974" class="t">Deploy: OIDC role (no stored keys) → plan → apply</text>
  <text x="640" y="994" class="t">post-deploy: /health 200 and unauthenticated 401</text>
  <text x="640" y="1012" class="s">environment "aws" can require reviewers</text>

  <text x="1220" y="912" class="h">Observability &amp; security</text>
  <text x="1220" y="934" class="t">CloudWatch: structured Lambda logs, API access logs</text>
  <text x="1220" y="954" class="t">X-Ray tracing on Lambdas and Step Functions</text>
  <text x="1220" y="974" class="t">Least-privilege IAM per component</text>
  <text x="1220" y="994" class="t">Worker may only modify netloom-tagged EC2 resources</text>
  <text x="1220" y="1012" class="s">AuthN: Cognito JWT · AuthZ: any authenticated user</text>
</svg>
