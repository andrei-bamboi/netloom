name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit + integration tests (moto)
        run: pytest -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - run: terraform fmt -check -recursive infra
      - name: Validate + contract tests (mock providers, no AWS)
        working-directory: infra/app
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
